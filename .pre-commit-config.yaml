# Mirrors .github/workflows/ci.yml and mol_project.build.check / build.test.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: typecheck
        name: tsc --noEmit
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: '\.(ts|tsx)$'

      - id: build-registry
        name: build registry
        entry: npm run build:registry
        language: system
        pass_filenames: false
        always_run: true
