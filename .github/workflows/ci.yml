name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workspace, packages, Storybook, and consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm verify:packages
      - name: Verify generated tokens and native sources
        run: git diff --exit-code -- packages/tokens/src packages/web-components/src packages/web-components/custom-elements.json docs/token-catalog.md packages/*/THIRD_PARTY_NOTICES.md
      - run: pnpm build:registry
      - run: pnpm build:catalog
      - name: Verify registry and component catalog
        run: git diff --exit-code -- public/r docs/component-catalog.md
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:web-components
      - run: pnpm build:consumer
      - run: pnpm test:consumer
      - run: pnpm verify:chart-boundaries
      - run: pnpm release:status
      - run: pnpm verify:release
      - run: pnpm build:storybook
      - run: pnpm test:storybook
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            packages/tokens/dist
            packages/ui/dist
            packages/web-components/dist
            packages/vega/dist
            packages/vega-lite/dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: storybook-static
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal
          path: release-artifacts
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: test-results
          retention-days: 7
