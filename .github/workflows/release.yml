name: release

# A `v*` tag on MolCrafts/molcrafts-ui: guard -> build and audit the five
# release-candidate archives (pnpm prepare:release) -> npm, in dependency order,
# on the channel the version names (alpha for 0.1.0-alpha.N) -> the GitHub
# Release. npm publishes the exact audited tarballs through trusted publishing
# (OIDC, with provenance); a version already on the registry is skipped, so a
# re-run or the tag after a manual first publish only records the release.
#
# A dispatch is the dry run, on any branch: the same guard and build, no upload
# and no Release. Only a tag push on MolCrafts uploads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Independent workflow/event/ref groups; feature pushes supersede older runs.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: release / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@0bc767f040a1558799539e6c7012de4ffcc9f499

  guard:
    name: release / guard
    needs: context
    if: github.event_name == 'workflow_dispatch' || needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: One version across the five packages
        id: version
        run: |
          version=$(node -e 'const p=require("./release/plan.json"); const v=new Set(p.packages.map(x=>require("./"+x.directory+"/package.json").version)); if (v.size!==1) { console.error("packages disagree: "+[...v]); process.exit(1) } console.log([...v][0])')
          channel=$(node -e 'const v=process.argv[1]; const m=v.match(/-([a-z]+)\./); console.log(m ? m[1] : "latest")' "$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: The tag is that version, on main
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$VERSION"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag is not on main"; exit 1; }

  build:
    name: release / build
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@0bc767f040a1558799539e6c7012de4ffcc9f499
        with:
          node-version: "24"
          install: "false"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:release
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release-artifacts
          retention-days: 30

  npm:
    name: release / npm
    needs: [context, guard, build]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    # setup-node with registry-url writes a placeholder NODE_AUTH_TOKEN, which
    # would override the OIDC exchange. Empty it so npm uses the id-token.
    env:
      NODE_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@0bc767f040a1558799539e6c7012de4ffcc9f499
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          install: "false"
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release-artifacts
      - name: Publish the audited archives, tokens first
        env:
          CHANNEL: ${{ needs.guard.outputs.channel }}
        run: |
          node -e 'for (const p of require("./release-artifacts/report.json").packages) console.log(p.name, p.version, p.file)' |
          while read -r name version file; do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipped"
            else
              npm publish "release-artifacts/$file" --tag "$CHANNEL" --access public --provenance
            fi
          done

  github:
    name: release / github
    needs: [context, guard, npm]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release-artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.guard.outputs.version }}
          CHANNEL: ${{ needs.guard.outputs.channel }}
        run: |
          awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{if(on)exit} on' packages/ui/CHANGELOG.md > notes.md
          prerelease=$([ "$CHANNEL" = latest ] || echo --prerelease)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease --title "MolCrafts UI $VERSION" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" release-artifacts/*.tgz release-artifacts/report.json --clobber
